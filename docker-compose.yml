services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: aulacontexto
      POSTGRES_USER: aula
      POSTGRES_PASSWORD: aula
    volumes:
      - dbdata:/var/lib/postgresql/data
      - ./api/db/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    ports: ["5432:5432"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U aula -d aulacontexto"]
      interval: 5s
      retries: 10
  api:
    build: ./api
    environment:
      DATABASE_URL: postgres://aula:aula@db:5432/aulacontexto
      JWT_SECRET: cambiar-en-produccion
      LLM_PROVIDER: mock
      PORT: 4000
    depends_on:
      db: { condition: service_healthy }
    ports: ["4000:4000"]
  web:
    build: ./web
    environment:
      VITE_API_URL: http://localhost:4000
    depends_on: [api]
    ports: ["8080:80"]
volumes:
  dbdata:
