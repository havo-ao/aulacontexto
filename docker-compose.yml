services:
  db:
    image: mysql:8.0
    environment:
      MYSQL_DATABASE: aulacontexto
      MYSQL_USER: aula
      MYSQL_PASSWORD: aula
      MYSQL_ROOT_PASSWORD: root
    command: --character-set-server=utf8mb4 --collation-server=utf8mb4_unicode_ci
    volumes:
      - dbdata:/var/lib/mysql
      - ./api/db/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    ports: ["3306:3306"]
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-uaula", "-paula"]
      interval: 5s
      retries: 10
  api:
    build: ./api
    environment:
      DATABASE_URL: mysql://aula:aula@db:3306/aulacontexto
      JWT_SECRET: cambiar-en-produccion
      LLM_PROVIDER: mock
      PORT: 4000
    depends_on:
      db: { condition: service_healthy }
    ports: ["4000:4000"]
  web:
    build: ./web
    environment:
      VITE_API_URL: http://localhost:4000
    depends_on: [api]
    ports: ["8080:80"]
volumes:
  dbdata:
